# Branding scan by hand: how fast-growing story channels present themselves, and whether candidate names are taken.
name: brand
on:
  workflow_dispatch:
    inputs:
      names: {description: "candidate channel names, separated by ;", required: false, default: ""}
concurrency: {group: metrics, cancel-in-progress: false}   # shares the API quota and docs/ with metrics
permissions: {contents: write}
jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt -r requirements-upload.txt
      - name: scan
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BRAND_NAMES: ${{ inputs.names }}
        run: python scripts/brand_scan.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4   # other people's avatars: kept 7 days, never committed
        with: {name: brand-avatars, path: out/brand-scan, retention-days: 7, if-no-files-found: ignore}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add docs/research/brand-scan
          git diff --cached --quiet || { git commit -m "brand scan: $(date -u +%F)" && git pull --rebase -q && git push; }
