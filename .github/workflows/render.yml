# Final render on GitHub's free runners (public repo). On every push to main, each story whose gate is open and
# that has no film yet (at most 2 a run, slots a and b) is drawn in 32 parallel shards, then assembled: finish, narration, mix and the
# flash measure. The film is kept as the run artifact `film-<story>` (90 days); the daily upload takes it from there.
name: render
on:
  push:
    branches: [main]
    paths: ["stories/*/**"]   # files inside a story folder only (not stories/lore.md or ideas.md)
  workflow_dispatch:
    inputs:
      story: {description: "story folder (blank = every story that's ready, at most 2 a run)", default: ""}
concurrency: {group: render, cancel-in-progress: false}
permissions: {contents: read, actions: read}
env:
  SHARDS: 32   # finer shards: a fast runner takes the next one (docs/research/render-throughput.md, change 6)
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      stories: ${{ steps.p.outputs.stories }}
      any: ${{ steps.p.outputs.any }}
      more: ${{ steps.p.outputs.more }}
      a: ${{ steps.p.outputs.a }}
      b: ${{ steps.p.outputs.b }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # changed_since() compares the story's last commit with its film
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt
      - id: p
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python scripts/plan_renders.py --story "${{ inputs.story }}" --shards $SHARDS >> "$GITHUB_OUTPUT"

  voice:   # the narration is made once, here: the picture is drawn to it and the mix uses it, so they can't drift
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        story: ${{ fromJSON(needs.plan.outputs.stories) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: sudo apt-get update -q && sudo apt-get install -yq espeak-ng
      - run: pip install -r requirements.txt -r requirements-tts.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-kokoro-v1}
      - name: narrate
        run: |
          export BLOCKY_TTS=$(which python)
          python -m blocky voice ${{ matrix.story }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.story }}
          path: |
            out/work/${{ matrix.story }}/vo/
            stories/${{ matrix.story }}/voice-timings.json
          retention-days: 5

  # Two slots (plan_renders.py caps a run at 2 stories), both drawing at once: each story's assemble waits only for its own
  # shards. 16 + 16 = 32 draw lanes of the account's ~40 (39 jobs ran together at 19:58:45 UTC on 2026-11-03); the other
  # ~8 are for one proof (8 draws) and the PR test checks. Never cancel a run while it is drawing.
  draw-a:
    needs: [plan, voice]
    if: ${{ !cancelled() && needs.plan.outputs.a != '' }}   # one story's failure doesn't stop the other
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 16   # both slots together: at most 32 draw lanes of the account's ~40; the rest is for a proof and PR tests
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render-draw
        with:
          story: ${{ needs.plan.outputs.a }}
          shard: ${{ matrix.shard }}
          shards: ${{ env.SHARDS }}

  assemble-a:
    needs: [plan, voice, draw-a]
    if: ${{ !cancelled() && needs.plan.outputs.a != '' && needs.draw-a.result == 'success' }}   # a story with a missing shard gets no film (closing-time, run 87)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render-assemble
        with: {story: "${{ needs.plan.outputs.a }}"}

  draw-b:
    needs: [plan, voice]   # not draw-a: both slots draw at once
    if: ${{ !cancelled() && needs.plan.outputs.b != '' }}   # one story's failure doesn't stop the other
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 16   # both slots together: at most 32 draw lanes of the account's ~40; the rest is for a proof and PR tests
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render-draw
        with:
          story: ${{ needs.plan.outputs.b }}
          shard: ${{ matrix.shard }}
          shards: ${{ env.SHARDS }}

  assemble-b:
    needs: [plan, voice, draw-b]
    if: ${{ !cancelled() && needs.plan.outputs.b != '' && needs.draw-b.result == 'success' }}   # a story with a missing shard gets no film (closing-time, run 87)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render-assemble
        with: {story: "${{ needs.plan.outputs.b }}"}

  again:   # more stories were ready than one run can hold: start another run for the rest
    needs: [plan, assemble-a, assemble-b]
    if: ${{ !cancelled() && needs.plan.outputs.more == 'true' }}   # never after a cancel: a cancelled run re-dispatched itself on 2026-11-03 and blocked the queue with stale stories
    runs-on: ubuntu-latest
    permissions: {actions: write}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - run: gh workflow run render.yml --repo "${{ github.repository }}" --ref main
