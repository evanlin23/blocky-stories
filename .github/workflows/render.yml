# Final render on GitHub's free runners (public repo). On every push to main, each story whose gate is open and
# that has no render release yet is drawn in 16 parallel shards, then assembled: finish, narration, mix and the
# flash measure. The film is kept as the run artifact `film-<story>` (90 days); the daily upload takes it from there.
name: render
on:
  push:
    branches: [main]
    paths: ["stories/*/**"]   # files inside a story folder only (not stories/lore.md or ideas.md)
  workflow_dispatch:
    inputs:
      story: {description: "story folder (blank = every story that's ready, at most 15 a run)", default: ""}
concurrency: {group: render, cancel-in-progress: false}
permissions: {contents: read, actions: read}
env:
  SHARDS: 16
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      stories: ${{ steps.p.outputs.stories }}
      any: ${{ steps.p.outputs.any }}
      more: ${{ steps.p.outputs.more }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # changed_since() compares the story's last commit with its film
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt
      - id: p
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python scripts/plan_renders.py --story "${{ inputs.story }}" --shards $SHARDS >> "$GITHUB_OUTPUT"

  voice:   # the narration is made once, here: the picture is drawn to it and the mix uses it, so they can't drift
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        story: ${{ fromJSON(needs.plan.outputs.stories) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: sudo apt-get update -q && sudo apt-get install -yq espeak-ng
      - run: pip install -r requirements.txt -r requirements-tts.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-kokoro-v1}
      - name: narrate
        run: |
          export BLOCKY_TTS=$(which python)
          python -m blocky voice ${{ matrix.story }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.story }}
          path: |
            out/work/${{ matrix.story }}/vo/
            stories/${{ matrix.story }}/voice-timings.json
          retention-days: 5

  draw:
    needs: [plan, voice]
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' }}   # one story's failure doesn't stop the others
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 16   # the free plan runs 20 jobs at once: leave 4 for the test checks on story PRs
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6
      - run: pip install -r requirements.txt -r requirements-bpy.txt
      - uses: actions/download-artifact@v4
        with: {name: "voice-${{ matrix.story }}", path: .}
      - name: draw shard ${{ matrix.shard }}
        run: |
          export BLOCKY_BPY=$(which python)
          python -m blocky timeline ${{ matrix.story }}
          python -m blocky render ${{ matrix.story }} --shard ${{ matrix.shard }}/$SHARDS
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.story }}-${{ matrix.shard }}
          path: out/work/${{ matrix.story }}/frames/*.png
          retention-days: 5
          compression-level: 0

  assemble:
    needs: [plan, voice, draw]
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        story: ${{ fromJSON(needs.plan.outputs.stories) }}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg espeak-ng
      - run: pip install -r requirements.txt -r requirements-tts.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: hf-kokoro-v1}
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-${{ matrix.story }}-*
          path: out/work/${{ matrix.story }}/frames
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with: {name: "voice-${{ matrix.story }}", path: .}
      - name: finish and mix (with the narration the picture was drawn to)
        run: |
          S=${{ matrix.story }}
          python -m blocky timeline $S
          python -m blocky finish $S
          python -m blocky mix $S
      - name: flash measure
        id: flash
        run: |
          S=${{ matrix.story }}
          set +e; python -m blocky flash $S; echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: cover frame
        run: |
          S=${{ matrix.story }}
          SLUG=$(python -c "import json;print(json.load(open('stories/$S/story.json')).get('slug','$S'))")
          python - "$S" "$SLUG" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          s, slug = sys.argv[1], sys.argv[2]
          pkg = Path(f"stories/{s}/package.json")
          cover = json.loads(pkg.read_text()).get("cover_s") if pkg.exists() else None
          dur = json.loads(Path(f"out/work/{s}/timeline.json").read_text())["duration"]
          t = float(cover) if cover is not None else round(dur * 0.78, 2)   # default: near the reveal
          subprocess.run(["ffmpeg", "-nostdin", "-v", "error", "-y", "-ss", f"{t:.2f}", "-i", f"out/{slug}.mp4",
                          "-frames:v", "1", "-q:v", "3", f"out/{slug}.cover.jpg"], check=True)
          Path(f"out/{slug}.cover.txt").write_text(f"{t:.2f}\n")
          PY
      - name: keep the film
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ matrix.story }}
          path: |
            out/*.mp4
            out/*.contact.png
            out/*.cover.jpg
            out/*.cover.txt
            out/*.flash.json
            out/work/${{ matrix.story }}/mix.json
          retention-days: 90
          compression-level: 0
      - name: flash result
        run: |
          if [ "${{ steps.flash.outputs.code }}" != "0" ]; then
            echo "::error::the film fails the flash bar; it's kept as the film artifact but won't be uploaded. Redraw the shots the flash report names."
            exit 1
          fi
          echo "film-${{ matrix.story }} is ready for the daily upload"

  again:   # more stories were ready than one run can hold: start another run for the rest
    needs: [plan, assemble]
    if: always() && needs.plan.outputs.more == 'true'
    runs-on: ubuntu-latest
    permissions: {actions: write}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - run: gh workflow run render.yml --repo "${{ github.repository }}" --ref main
