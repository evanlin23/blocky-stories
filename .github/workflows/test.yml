name: test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [uploads.json, "metrics/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: check every story
        run: for s in $(ls stories); do [ -f stories/$s/story.json ] && { python -m blocky timeline $s >/dev/null && python -m blocky check $s || exit 1; }; done
