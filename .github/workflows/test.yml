name: test
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [uploads.json, "metrics/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: check every story
        run: |
          for f in stories/*/story.json; do
            s=$(basename "$(dirname "$f")")
            python -m blocky timeline "$s" >/dev/null
            python -m blocky check "$s"
          done
      - name: gate every story this PR changes (a story merges only when it's ready to render and its proof passed qa)
        if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'WIP')
        env: {BASE: "${{ github.event.pull_request.base.sha }}"}
        # A story whose only block is its missing or stale proof says "waiting for proof" (still blocking: no story
        # merges without a passed proof qa, RULES.md 2026-11-03); anything else is a real failure.
        run: |
          bad=0
          for s in $(git diff --name-only "$BASE" HEAD -- 'stories/*/*' | cut -d/ -f2 | sort -u); do
            [ -f "stories/$s/story.json" ] || continue
            out=$(python -m blocky gate "$s" --merge --base "$BASE" 2>&1) && { echo "$out"; continue; }
            echo "$out"; bad=1
            if ! echo "$out" | grep '^BLOCK' | grep -qv '^BLOCK waiting for proof: '; then
              echo "::warning title=waiting for proof::$s is ready except its proof: $(echo "$out" | grep -m1 '^BLOCK' | cut -c7-)"
              echo "- **$s: waiting for proof** (nothing else blocks it)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=gate closed::$s: $(echo "$out" | grep '^BLOCK' | grep -m1 -v '^BLOCK waiting for proof: ' | cut -c7-)"
              echo "- **$s: gate closed**, see the log" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit $bad
