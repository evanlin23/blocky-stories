# Post the channel's comment (package.json "pin") on each uploaded story once it's public. Started by cron-job.org
# a little after the 4:00 PM Central publish (docs/external-cron.md); run it by hand any time.
name: comments
on:
  workflow_dispatch:
concurrency: {group: upload, cancel-in-progress: false}   # shares uploads.json with upload.yml
permissions: {contents: write}
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt -r requirements-upload.txt
      - name: comment
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          python scripts/comment.py
