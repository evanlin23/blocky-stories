# Once a day: the next ready story goes up to PandaNanoAdventures as a private video, and an issue tells the
# owner it's waiting to be published. Run it by hand from the Actions tab to upload one now.
name: upload
on:
  schedule:
    - cron: "23 15 * * *"   # 15:23 UTC = 9:23 am Central (10:23 am in summer)
    - cron: "47 21 * * *"   # 21:47 UTC = 3:47 pm Central; backup run: GitHub sometimes skips a schedule; upload.py posts at most one a day
  workflow_dispatch:
    inputs:
      story: {description: "story folder (blank = the next ready one)", default: ""}
concurrency: {group: upload, cancel-in-progress: false}
permissions: {contents: write, issues: write, actions: read}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt -r requirements-upload.txt
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_AUDITED: ${{ vars.YT_AUDITED || secrets.YT_AUDITED }}   # a variable, or a secret if it was saved there
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          python scripts/upload.py --story "${{ inputs.story }}"
