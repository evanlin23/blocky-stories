# Once a day: the next ready story goes up to Buhtown as a private video, and an issue tells the
# owner it's waiting to be published. Run it by hand from the Actions tab to upload one now.
name: upload
on:
  # no `schedule:`: cron-job.org starts this at 6:47 AM Central (docs/external-cron.md). GitHub's own schedule woke up
  # on 2026-11-02 after weeks of silence and fired hours late (9:04 PM Central), so it's gone.
  workflow_dispatch:
    inputs:
      story: {description: "story folder (blank = the next ready one)", default: ""}
concurrency: {group: upload, cancel-in-progress: false}
permissions: {contents: write, issues: write, actions: read}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # changed_since() needs real history; a shallow clone dates every story to HEAD
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt -r requirements-upload.txt
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg   # upload.py re-measures each film's flash with the current bar
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_AUDITED: ${{ vars.YT_AUDITED || secrets.YT_AUDITED }}
          UPLOADS_PER_DAY: ${{ vars.UPLOADS_PER_DAY || '2' }}   # a variable, or a secret if it was saved there
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          python scripts/upload.py --story "${{ inputs.story }}"
          # a second story the same day (it goes public at 7:30 PM) while the queue can afford it (UPLOADS_PER_DAY, default 2)
          if [ -z "${{ inputs.story }}" ]; then python scripts/upload.py; fi
