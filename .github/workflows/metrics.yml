# Weekly channel numbers into metrics/summary.md, a little before the Monday /week run. Run it by hand any time.
name: metrics
on:
  schedule:
    - cron: "37 20 * * 1"   # Mondays 20:37 UTC (2:37 pm Central)
  workflow_dispatch:
concurrency: {group: metrics, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install -r requirements.txt -r requirements-upload.txt
      - name: pull the numbers
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
        run: python scripts/metrics.py >> "$GITHUB_STEP_SUMMARY"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || { git commit -m "metrics: $(date -u +%F)" && git push; }
